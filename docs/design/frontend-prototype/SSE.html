<style>
  :root {
    --green-900: #1f3a30;
    --green-800: #294a3c;
    --green-700: #335a48;
    --ink: #111315;
    --ink-2: #2a2d31;
    --line: #e3e5e8;
    --line-2: #d3d6db;
    --bg: #f3f4f5;
    --bg-2: #eaecee;
    --muted: #6c7176;
    --accent: #2f6fb5;
    --accent-soft: #cfdff2;
    --good: #2e7d4f;
    --bad: #b3261e;
    --warn: #b27a13;
  }
  html, body { background: var(--bg); color: var(--ink); }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  /* utility helpers */
  .bg-green-header { background-color: var(--green-800); }
  .bg-green-deep { background-color: var(--green-900); }
  .text-green-header { color: var(--green-800); }
  .border-line { border-color: var(--line); }
  .border-line-2 { border-color: var(--line-2); }
  .bg-band { background-color: #b9bcc0; }
  .text-muted { color: var(--muted); }
  /* checkered placeholder for image */
  .img-placeholder {
    background-color: #d8dadd;
    background-image:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.04) 0 12px, transparent 12px 24px);
  }
  /* status dot pulse */
  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .55; transform: scale(.85); }
  }
  .pulse-dot { animation: pulseDot 1.6s ease-in-out infinite; }
  /* subtle scrollbars */
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-thumb { background: #c8ccd1; border-radius: 8px; }
  *::-webkit-scrollbar-track { background: transparent; }
  /* form inputs */
  .field {
    width: 100%;
    border: 1px solid var(--line-2);
    background: #fff;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field:focus { border-color: var(--green-700); box-shadow: 0 0 0 3px rgba(51,90,72,.15); }
  .field::placeholder { color: #a6abb1; }
  .label-text { font-size: 13px; color: #3a3d42; font-weight: 500; margin-bottom: 6px; display: block; }
  /* primary dark pill button */
  .btn-dark {
    background: #111315; color: #fff; border-radius: 9999px;
    padding: 8px 18px; font-size: 13px; font-weight: 500;
    transition: background .15s, transform .05s;
  }
  .btn-dark:hover { background: #2a2d31; }
  .btn-dark:active { transform: translateY(1px); }
  .btn-dark:disabled { background: #6c7176; cursor: not-allowed; }
  .btn-ghost {
    background: #fff; color: var(--ink); border: 1px solid var(--line-2);
    border-radius: 9999px; padding: 7px 16px; font-size: 13px; font-weight: 500;
  }
  .btn-ghost:hover { background: #f7f8f9; }
  /* tabs */
  .tab {
    padding: 12px 20px;
    border-bottom: 2px solid transparent;
    color: var(--muted);
    font-weight: 500;
    font-size: 14px;
    cursor: pointer;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--ink); }
  /* link reset */
  a { color: inherit; text-decoration: none; }
  /* chip */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 9999px; padding: 4px 10px;
    font-size: 12px; font-weight: 500;
    border: 1px solid var(--line-2);
    background: #fff;
  }
  /* card */
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  .card-pad { padding: 20px; }
  /* section banner */
  .banner {
    background: #b9bcc0; color: #fff; text-align: center;
    padding: 14px 20px; border-radius: 10px; font-weight: 600; letter-spacing: .01em;
  }
  /* nav link */
  .navlink {
    padding: 6px 12px; border-radius: 8px; font-size: 14px; color: rgba(255,255,255,0.85);
    transition: background .15s, color .15s;
  }
  .navlink:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .navlink.active { background: rgba(255,255,255,0.14); color: #fff; }
  /* select chevron native is fine */
  /* range slider */
  input[type="range"] { accent-color: var(--green-800); }
</style>
