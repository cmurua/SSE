[alembic]
script_location = migrations

# Permite `alembic` desde apps/backend sin instalar el paquete: agrega este
# directorio al sys.path para que env.py pueda importar `app`.
prepend_sys_path = .

# sqlalchemy.url se define a proposito en env.py, leyendola de Settings
# (variable DATABASE_URL). No declararla aca evita versionar la credencial
# y tener dos fuentes de verdad que se desincronizan.

[loggers]
keys = root,sqlalchemy,alembic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handlers]
keys = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
