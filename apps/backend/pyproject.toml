[project]
name = "sse-ra0-backend"
version = "0.1.0"
description = "API del Sistema de Soporte a la Ensenanza del Reactor RA-0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# El repo usa flat-layout y junto a `app/` conviven `migrations/` y `tests/`,
# que no son parte del paquete distribuible. Sin esta seccion, la deteccion
# automatica de setuptools aborta con "Multiple top-level packages discovered".
[tool.setuptools.packages.find]
include = ["app*"]
