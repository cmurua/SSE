# Broker MQTT de DESARROLLO. No es una configuracion de produccion: escucha en
# claro y acepta clientes sin credenciales.
#
# En el reactor hay que endurecerlo antes de exponerlo -- al menos usuario y
# contrasena (mosquitto_passwd) y TLS en el listener, con las credenciales en
# MQTT_USERNAME / MQTT_PASSWORD del backend, que ya estan previstas en
# Settings. Ver docs/decisions/0004-representacion-sermo.md.

listener 1883 0.0.0.0
allow_anonymous true

# Persistencia: sin esto, reiniciar el broker borra el mensaje RETENIDO de
# SERMO y el backend arranca sin saber si el reactor opera hasta la proxima
# transicion. Con persistencia, el ultimo valor sobrevive al reinicio.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

log_dest stdout
log_type error
log_type warning
log_type notice
